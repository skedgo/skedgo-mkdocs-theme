{%- block next_prev %}
  {%- if page and (page.next_page or page.previous_page) %}
    <div
      class="grid grid-cols-2 rounded-xl border border-gray-200 p-2"
      role="navigation"
    >
      <div class="{% if not page.previous_page %}hidden{% endif %}">
        <a
          rel="prev"
          {% if page.previous_page %}href="/{{ page.previous_page.url }}"{% endif %}
          class="flex rounded-lg p-2 text-gray-900 transition-all hover:bg-gray-100 hover:text-gray-700"
        >
          <div class="text-gray-400">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-chevron-left-icon lucide-chevron-left"
            >
              <path d="m15 18-6-6 6-6" />
            </svg>
          </div>
          <div class="font-semibold">{{ page.previous_page.title }}</div>
        </a>
      </div>

      <div class="{% if not page.next_page %}hidden{% endif %} col-start-2">
        <a
          rel="next"
          {% if page.next_page %}href="/{{ page.next_page.url }}"{% endif %}
          class="flex justify-end rounded-lg p-2 text-gray-900 transition-all hover:bg-gray-100 hover:text-gray-700"
        >
          <div class="font-semibold">{{ page.next_page.title }}</div>
          <div class="text-gray-400">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-chevron-right-icon lucide-chevron-right"
            >
              <path d="m9 18 6-6-6-6" />
            </svg>
          </div>
        </a>
      </div>
    </div>
  {%- endif %}
{%- endblock %}
