<footer class="mx-auto max-w-[1200px] px-4">
  <div
    class="mb-4 flex flex-col items-center justify-center gap-10 border-t border-gray-100 py-16 md:flex-row md:justify-between md:gap-4"
  >
    <div class="flex flex-col items-center gap-4 md:flex-row">
      {%- block homelogo %}
        <a href="https://www.skedgo.com" target="_blank">
          <img
            src="{{ base_url }}/img/skedgo-logo-blue-green.svg"
            width="112"
            height="20"
          />
        </a>
      {%- endblock %}
      <a
        class="flex flex-wrap items-center text-lg font-semibold text-gray-500 hover:text-gray-900"
        href="{{ nav.homepage.url|url }}"
      >
        {{ config.site_name }}
      </a>
    </div>
    <ul class="flex gap-6 text-sm">
      <li>
        <a
          class="font-medium text-gray-500 transition-all hover:text-gray-900"
          target="_blank"
          href="https://skedgo.com/tripgo-api/pricing/"
          >Pricing</a
        >
      </li>
      <li>
        <a
          class="font-medium text-gray-500 transition-all hover:text-gray-900"
          target="_blank"
          href="https://github.com/skedgo/tripgo-api/issues"
          >Report issue</a
        >
      </li>
      <li>
        <a
          class="font-medium text-gray-500 transition-all hover:text-gray-900"
          href="mailto:api@tripgo.com"
          >Email support</a
        >
      </li>
      <li>
        <a
          class="font-medium text-gray-500 transition-all hover:text-gray-900"
          target="_blank"
          href="http://slack.tripgo.com/"
          >Slack community</a
        >
      </li>
    </ul>
  </div>
</footer>
