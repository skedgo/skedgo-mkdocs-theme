<div class="relative hidden w-[280px] shrink-0 md:block" role="complementary">
  <div
    class="sticky top-32 rounded-2xl border-1 border-gray-200 py-3"
    role="complementary"
    id="sidebar"
  >
    <ul id="toc" class="flex flex-col gap-2">
      {%- for toc_item in page.toc %}
        {% if not loop.first %}
          <div class="px-4 py-2">
            <div class="h-0.25 bg-gray-200"></div>
          </div>
        {% endif %}
        <li class="mb-1 px-4 text-lg leading-5 font-semibold">
          <a
            href="{{ toc_item.url }}"
            class="{% if toc_item.active %}active{% endif %}"
            >{{ toc_item.title }}</a
          >
        </li>
        {%- for toc_item in toc_item.children %}
          <li>
            <a
              href="{{ toc_item.url }}"
              class="{% if toc_item.active %}active{% endif %} transition-color -ml-px block border-l border-transparent pl-4 text-sm text-gray-500 hover:border-gray-400 hover:text-gray-900"
              >{{ toc_item.title }}</a
            >
          </li>
        {%- endfor %}
      {%- endfor %}
    </ul>
  </div>
</div>
